name: Test no matching matrix output files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare an unrelated output file outside the workspace
        run: |
          mkdir -p /tmp/act-mo-nofiles
          echo '{"leg":{"x":"y"}}' > /tmp/act-mo-nofiles/actmounrelatedstep
      - name: Upload unrelated artifact
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: act-mo-nofiles
          path: /tmp/act-mo-nofiles/actmounrelatedstep
      - id: action
        uses: .
        with:
          matrix-step-name: actmononexistentstep
      - name: Assert empty object result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ "$NORM" != "{}" ]; then
            echo "FAIL: expected '{}'"
            exit 1
          fi
          echo "PASS"

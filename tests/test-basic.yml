name: Test basic multi-leg matrix outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare matrix output files outside the workspace
        run: |
          mkdir -p /tmp/act-mo-basic-a /tmp/act-mo-basic-b
          echo '{"leg-a":{"image":"img-a","tag":"1.0"}}' > /tmp/act-mo-basic-a/actmobasicstep
          echo '{"leg-b":{"image":"img-b"}}' > /tmp/act-mo-basic-b/actmobasicstep
      - name: Upload leg-a output as artifact
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: act-mo-basic-a
          path: /tmp/act-mo-basic-a/actmobasicstep
      - name: Upload leg-b output as artifact
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: act-mo-basic-b
          path: /tmp/act-mo-basic-b/actmobasicstep
      - id: action
        uses: .
        with:
          matrix-step-name: actmobasicstep
      - name: Assert merged result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED='{"image":{"leg-a":"img-a","leg-b":"img-b"},"tag":{"leg-a":"1.0"}}'
          if ! echo "$ACTUAL" | jq -e --argjson exp "$EXPECTED" '. == $exp' >/dev/null; then
            echo "FAIL: expected $EXPECTED"
            exit 1
          fi
          echo "PASS"

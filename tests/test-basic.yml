name: Test basic merge of two matrix outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare matrix output files (outside the workspace)
        run: |
          mkdir -p /tmp/mxb-one /tmp/mxb-two
          echo '{"linux":{"image":"img-linux","status":"ok"}}' > /tmp/mxb-one/mxtest-build-basic
          echo '{"windows":{"image":"img-win","status":"fail"}}' > /tmp/mxb-two/mxtest-build-basic
      - name: Upload first matrix output artifact
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: mxb-basic-linux
          path: /tmp/mxb-one/mxtest-build-basic
      - name: Upload second matrix output artifact
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: mxb-basic-windows
          path: /tmp/mxb-two/mxtest-build-basic
      - id: action
        uses: .
        with:
          matrix-step-name: mxtest-build-basic
      - name: Assert merged result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED='{"image":{"linux":"img-linux","windows":"img-win"},"status":{"linux":"ok","windows":"fail"}}'
          A="$(echo "$ACTUAL" | jq -S -c .)"
          E="$(echo "$EXPECTED" | jq -S -c .)"
          if [ "$A" != "$E" ]; then
            echo "FAIL: expected $E got $A"
            exit 1
          fi
          echo "PASS"
      - name: Assert fromJSON access works
        env:
          IMG: ${{ fromJSON(steps.action.outputs.result).image.windows }}
        run: |
          echo "image.windows: $IMG"
          if [ "$IMG" != "img-win" ]; then
            echo "FAIL: expected img-win"
            exit 1
          fi
          echo "PASS"
